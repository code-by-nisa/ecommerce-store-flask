{% extends "base.html" %}
{% block title %}{{ p.name }}{% endblock %}
{% block content %}
<div class="detail">
  <div class="img big">{{ p.name[0] }}</div>
  <div>
    <h1>{{ p.name }}</h1>
    <p class="price">Rs. {{ p.price }}</p>
    <p>{{ p.desc }}</p>
    <form method="post" action="{{ url_for('add_to_cart', pid=p.id) }}">
      <button class="btn">Cart mein daalein</button>
    </form>
  </div>
</div>
{% endblock %}
